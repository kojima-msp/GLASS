[project]
name = "glass"
version = "0.1.0"
description = "Official PyTorch implementation of the paper \"Deep Algorithm Unrolling for Time-Varying Graph Signal Restoration under Spatiotemporal Smoothness Priors\"."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "gdown>=6.1.0",
    "hydra-core>=1.3.3",
    "matplotlib<3.11",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "rootutils>=1.0.7",
    "scienceplots>=2.2.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "torch-geometric>=2.8.0",
    "tqdm>=4.68.2",
]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
